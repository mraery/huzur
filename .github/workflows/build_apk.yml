name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Huzur-v1.0.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzur-Android-APK
          path: build/app/outputs/flutter-apk/Huzur-v1.0.0-release.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "✨ Huzur v1.0.0 (Android APK)"
          body: |
            ## 🌿 Huzur - Günlük Olumlama & Meditasyon Android APK

            Huzur uygulamasının ilk resmi Android sürümü hazır!

            ### ✨ Öne Çıkan Özellikler:
            - 🎴 **3D Kaydırılabilir Olumlama Kartları**: Sağa kaydırarak kalbine kaydet, sola kaydırarak sonrakine geç.
            - 🏕️ **Web Audio API Ortam Sesleri**: Çıtırdayan kamp ateşi, gece cırcır böcekleri, 432Hz meditatif piyano, akan orman deresi ve Tibet çanağı.
            - 📸 **Görsel Olarak İndir**: Olumlamayı tek tıkla Instagram hikayesi veya durum görseli olarak cihazına kaydet.
            - ⏱️ **Dinginlik Zamanlayıcısı**: 3, 5, 10 veya 15 dakikalık meditasyon seansları ve bitiş çanı.
            - 📱 **Tamamen Çevrimdışı Çalışma**: Sıfır internet bağımlılığıyla her an zihnini sakinleştir.

            Aşağıdaki `Huzur-v1.0.0-release.apk` dosyasını telefonunuza indirip doğrudan kurabilirsiniz.
          files: build/app/outputs/flutter-apk/Huzur-v1.0.0-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
