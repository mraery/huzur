name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Huzur-v1.1.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzur-Android-APK
          path: build/app/outputs/flutter-apk/Huzur-v1.1.0-release.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: "✨ Huzur v1.1.0 - 100+ Günlük Olumlama (Android APK)"
          body: |
            ## 🌿 Huzur v1.1.0 - 100+ Günlük Olumlama & Meditasyon APK

            Uygulama kütüphanesi devasa boyutta genişletildi!

            ### ✨ Sürüm 1.1.0 Yenilikleri:
            - 📚 **100+ Özenle Hazırlanmış Olumlama**: İç huzur, öz sevgi, bolluk/başarı, şükran, sağlık ve cesaret kategorilerinde 102 adet ilham verici içerik.
            - 🎴 **3D Kaydırılabilir Kartlar**: Sağa kaydırarak favorilere ekle, sola kaydırarak sonrakine geç.
            - 🏕️ **Huzur Verici Ortam Sesleri**: Çıtırdayan kamp ateşi, cırcır böcekleri, 432Hz meditatif piyano, akan orman deresi ve Tibet çanağı.
            - 📸 **Instagram / Durum İçin Görsel İndirme**: Tek tıkla 1080x1350 formatında şık kart görseli kaydetme.
            - ⏱️ **Dinginlik Zamanlayıcısı & Tibet Çanı**: 3, 5, 10, 15 dakikalık seanslar.
            - 📱 **%100 Çevrimdışı**: İnternet bağlantısı olmadan da her yerde çalışır.

            Aşağıdaki `Huzur-v1.1.0-release.apk` dosyasını telefonunuza indirip doğrudan kurabilirsiniz.
          files: build/app/outputs/flutter-apk/Huzur-v1.1.0-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
